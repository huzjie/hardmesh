apiVersion: apps/v1
kind: Deployment
metadata:
  name: hardmesh
  namespace: hardmesh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hardmesh
  template:
    metadata:
      labels:
        app: hardmesh
    spec:
      containers:
        - name: hardmesh
          image: huzjie/hardmesh:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: HARDMESH_SERVER__PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
