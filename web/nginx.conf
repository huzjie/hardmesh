server {
    listen 80;
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    location /healthz { proxy_pass http://hardmesh:8080; }
    location /devices { proxy_pass http://hardmesh:8080; }
    location /metrics { proxy_pass http://hardmesh:8080; }
}
